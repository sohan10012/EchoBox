<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/><circle cx='12' cy='10' r='1'/><circle cx='8' cy='10' r='1'/><circle cx='16' cy='10' r='1'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="EchoBox — Create your space, share your link, and receive honest, anonymous feedback." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>EchoBox — Premium Anonymous Feedback</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('echobox_theme');
          var isDark = stored ? stored === 'dark' : true; // Default dark
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fbfbfb] text-neutral-900 dark:bg-[#090909] dark:text-[#ededed] min-h-[100dvh] antialiased selection:bg-brand-500/20 selection:text-brand-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
